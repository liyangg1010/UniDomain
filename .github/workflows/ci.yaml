name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        pip install -e .

    - name: Lint and Sort Imports with Ruff
      run: |
        ruff check . --output-format=github
        
    - name: Test Import
      run: |
        python -c "import unidomain; print('Successfully imported unidomain!')"
        python -c "from unidomain.services import llm_agent; print('LLM Agent ok')"
