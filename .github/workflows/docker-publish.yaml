name: Build and Publish Docker Images

on:
  # Trigger workflow only when pushing to main and only when specified files changed
  push:
    branches:
      - main
    tags:
      - 'v*'   # Listen to tag push: v* (tag is not limited by paths).
    paths:
      - 'docker/**'
      - 'pyproject.toml'
      - '.github/workflows/docker-publish.yaml'

  # Trigger workflow manually, only update latest
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-cpu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name and owner (lowercase)
        id: vars
        run: |
          IMAGE_NAME=unidomain
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "OWNER=$OWNER" >> $GITHUB_OUTPUT

      # If it's a tag build (refs/tags/v0.3.0), extract TAG_NAME = v0.3.0
      - name: Extract version from tag (if tag build)
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=" >> $GITHUB_OUTPUT
          fi

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.cpu
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.OWNER }}/${{ steps.vars.outputs.IMAGE_NAME }}:cpu-latest
            ${{ steps.version.outputs.TAG_NAME != '' && format('ghcr.io/{0}/{1}:cpu-{2}', steps.vars.outputs.OWNER, steps.vars.outputs.IMAGE_NAME, steps.version.outputs.TAG_NAME) || null }}

  build-gpu:
    runs-on: ubuntu-latest
    needs: build-cpu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name and owner (lowercase)
        id: vars
        run: |
          IMAGE_NAME=unidomain
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "OWNER=$OWNER" >> $GITHUB_OUTPUT

      - name: Extract version from tag (if tag build)
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=" >> $GITHUB_OUTPUT
          fi

      - name: Build and push GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.gpu
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.OWNER }}/${{ steps.vars.outputs.IMAGE_NAME }}:gpu-latest
            ${{ steps.version.outputs.TAG_NAME != '' && format('ghcr.io/{0}/{1}:gpu-{2}', steps.vars.outputs.OWNER, steps.vars.outputs.IMAGE_NAME, steps.version.outputs.TAG_NAME) || null }}